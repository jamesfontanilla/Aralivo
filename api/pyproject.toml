[project]
name = "aralivo-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "alembic==1.14.0",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "PyJWT==2.10.1",
  "cryptography==44.0.0",
  "stellar-sdk==14.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

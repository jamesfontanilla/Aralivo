<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Historical antecedents form branching pathways</title>
  <desc id="desc">A branching diagram shows environment, practices, institutions, and circulation converging on later science and technology, with feedback creating new questions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="1" stop-color="#eef8f6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#5367a6"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#26345d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#1e2848">Antecedents are pathways, not a single ladder</text>
  <text x="60" y="88" font-family="Inter,Arial,sans-serif" font-size="15" fill="#59627a">Different roots can converge, and later systems can create new needs that send history in new directions.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <rect x="58" y="135" width="190" height="104" rx="18" fill="#fff" stroke="#c8c9f0" stroke-width="2"/>
    <text x="82" y="168" font-size="16" font-weight="700" fill="#3f3a83">Environment</text>
    <text x="82" y="194" font-size="13" fill="#59627a">water, soil, hazards,</text>
    <text x="82" y="214" font-size="13" fill="#59627a">materials, seasons</text>

    <rect x="58" y="283" width="190" height="104" rx="18" fill="#fff" stroke="#b8e0d6" stroke-width="2"/>
    <text x="82" y="316" font-size="16" font-weight="700" fill="#267664">Practices</text>
    <text x="82" y="342" font-size="13" fill="#59627a">cultivation, craft,</text>
    <text x="82" y="362" font-size="13" fill="#59627a">measurement, teaching</text>

    <rect x="365" y="135" width="190" height="104" rx="18" fill="#fff" stroke="#c8c9f0" stroke-width="2"/>
    <text x="389" y="168" font-size="16" font-weight="700" fill="#3f3a83">Institutions</text>
    <text x="389" y="194" font-size="13" fill="#59627a">labor, rules, schools,</text>
    <text x="389" y="214" font-size="13" fill="#59627a">records, authority</text>

    <rect x="365" y="283" width="190" height="104" rx="18" fill="#fff" stroke="#b8e0d6" stroke-width="2"/>
    <text x="389" y="316" font-size="16" font-weight="700" fill="#267664">Circulation</text>
    <text x="389" y="342" font-size="13" fill="#59627a">trade, travel, text,</text>
    <text x="389" y="362" font-size="13" fill="#59627a">translation, adaptation</text>

    <rect x="690" y="205" width="220" height="116" rx="20" fill="#5367a6"/>
    <text x="722" y="243" font-size="17" font-weight="700" fill="#fff">Later science &amp;</text>
    <text x="722" y="267" font-size="17" font-weight="700" fill="#fff">technology</text>
    <text x="722" y="293" font-size="13" fill="#e8ecff">tools, models, systems,</text>
    <text x="722" y="312" font-size="13" fill="#e8ecff">questions, choices</text>

    <rect x="980" y="205" width="160" height="116" rx="20" fill="#f7b267"/>
    <text x="1007" y="243" font-size="16" font-weight="700" fill="#553415">New needs</text>
    <text x="1007" y="269" font-size="13" fill="#6f4b2b">feedback, conflict,</text>
    <text x="1007" y="289" font-size="13" fill="#6f4b2b">redesign, questions</text>
  </g>

  <g fill="none" stroke="#5367a6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M248 187 C295 187 320 187 365 187"/>
    <path d="M248 335 C300 335 315 335 365 335"/>
    <path d="M555 187 C610 187 635 225 690 245"/>
    <path d="M555 335 C610 335 635 302 690 282"/>
    <path d="M248 205 C350 255 500 256 690 260"/>
    <path d="M910 263 C942 263 954 263 980 263"/>
  </g>
  <path d="M1060 205 C1060 150 790 142 790 205" fill="none" stroke="#e28b39" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="815" y="151" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#aa6424">feedback loop</text>

  <text x="60" y="425" font-family="Inter,Arial,sans-serif" font-size="13" fill="#59627a">Label each arrow with a mechanism: need, labor, evidence, trade, regulation, or adaptation.</text>
</svg>
